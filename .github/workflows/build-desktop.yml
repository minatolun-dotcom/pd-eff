name: Build Desktop Apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: |
          cd backend
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt pikepdf nest-asyncio pyinstaller

      - name: Install Node dependencies
        run: |
          cd frontend
          npm install --legacy-peer-deps

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Build Linux executable
        run: |
          cd backend
          source venv/bin/activate
          cat > run_desktop.py << 'EOF'
          import os, sys, uvicorn
          port = int(os.environ.get('PORT', 8765))
          print(f"Starting pd-eff on port {port}...")
          uvicorn.run("pdf_signer.main:app", host="0.0.0.0", port=port)
          EOF
          pyinstaller --onefile --name pd-eff \
            --distpath ../desktop/dist/linux \
            --workpath /tmp/pyinstaller \
            --clean \
            --add-data "pdf_signer:pdf_signer" \
            --hidden-import pdf_signer --hidden-import pdf_signer.main \
            --hidden-import pdf_signer.database --hidden-import pdf_signer.signing_service \
            --hidden-import pdf_signer.verification_service --hidden-import pdf_signer.cert_utils \
            --hidden-import pdf_signer.config --hidden-import pdf_signer.pkcs11_service \
            --hidden-import uvicorn --hidden-import uvicorn.logging \
            --hidden-import uvicorn.loops --hidden-import uvicorn.loops.auto \
            --hidden-import uvicorn.protocols --hidden-import uvicorn.protocols.http \
            --hidden-import uvicorn.protocols.http.auto \
            --hidden-import uvicorn.protocols.websockets --hidden-import uvicorn.protocols.websockets.auto \
            --hidden-import uvicorn.lifespan --hidden-import uvicorn.lifespan.on \
            run_desktop.py

      - name: Package Linux build
        run: |
          mkdir -p desktop/dist/pd-eff-linux-x64
          cp desktop/dist/linux/pd-eff desktop/dist/pd-eff-linux-x64/
          chmod +x desktop/dist/pd-eff-linux-x64/pd-eff
          cp -r backend/pdf_signer desktop/dist/pd-eff-linux-x64/
          mkdir -p desktop/dist/pd-eff-linux-x64/data/{uploads,signed,certs}

          cat > desktop/dist/pd-eff-linux-x64/pd-eff-wrapper << 'WRAPPER'
          #!/bin/bash
          cd "$(dirname "$0")"
          export PORT=8765
          echo "🔐 pd-eff starting on http://localhost:8765"
          ./pd-eff &
          PID=$!
          sleep 2
          xdg-open http://localhost:8765 2>/dev/null
          trap "kill $PID 2>/dev/null" EXIT
          wait
          WRAPPER
          chmod +x desktop/dist/pd-eff-linux-x64/pd-eff-wrapper
          mv desktop/dist/pd-eff-linux-x64/pd-eff desktop/dist/pd-eff-linux-x64/pd-eff-server
          mv desktop/dist/pd-eff-linux-x64/pd-eff-wrapper desktop/dist/pd-eff-linux-x64/pd-eff

          cd desktop/dist
          tar -czf pd-eff-linux-x64.tar.gz pd-eff-linux-x64/

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: pd-eff-linux-x64
          path: desktop/dist/pd-eff-linux-x64.tar.gz

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: |
          cd backend
          python -m venv venv
          source venv/Scripts/activate
          pip install -r requirements.txt pikepdf nest-asyncio pyinstaller

      - name: Install Node dependencies
        run: |
          cd frontend
          npm install --legacy-peer-deps

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Build Windows executable
        run: |
          cd backend
          source venv/Scripts/activate
          cat > run_desktop.py << 'PYEOF'
          import os, sys, uvicorn
          port = int(os.environ.get('PORT', 8765))
          print(f"Starting pd-eff on port {port}...")
          uvicorn.run("pdf_signer.main:app", host="0.0.0.0", port=port)
          PYEOF
          mkdir -p ../desktop/dist/windows
          pyinstaller --onefile --name pd-eff.exe \
            --distpath ../desktop/dist/windows \
            --workpath /c/tmp/pyinstaller \
            --clean \
            --add-data "pdf_signer;pdf_signer" \
            --hidden-import pdf_signer --hidden-import pdf_signer.main \
            --hidden-import pdf_signer.database --hidden-import pdf_signer.signing_service \
            --hidden-import pdf_signer.verification_service --hidden-import pdf_signer.cert_utils \
            --hidden-import pdf_signer.config --hidden-import pdf_signer.pkcs11_service \
            --hidden-import uvicorn --hidden-import uvicorn.logging \
            --hidden-import uvicorn.loops --hidden-import uvicorn.loops.auto \
            --hidden-import uvicorn.protocols --hidden-import uvicorn.protocols.http \
            --hidden-import uvicorn.protocols.http.auto \
            --hidden-import uvicorn.protocols.websockets --hidden-import uvicorn.protocols.websockets.auto \
            --hidden-import uvicorn.lifespan --hidden-import uvicorn.lifespan.on \
            run_desktop.py
          echo "Build output:"
          ls -la ../desktop/dist/windows/

      - name: Sign Windows executable
        run: |
          # Create a self-signed certificate for code signing
          # For production, replace with a real EV certificate from SignPath.io or DigiCert
          powershell -Command "
            $cert = New-SelfSignedCertificate \
              -Subject 'CN=pd-eff, O=pd-eff, C=US' \
              -Type CodeSigningCert \
              -CertStoreLocation Cert:\CurrentUser\My \
              -NotAfter (Get-Date).AddYears(5) \
              -HashAlgorithm SHA256
            
            # Export to PFX
            $pwd = ConvertTo-SecureString -String 'pd-eff-signing' -Force -AsPlainText
            Export-PfxCertificate -Cert $cert -FilePath C:\tmp\code-signing.pfx -Password $pwd
            
            # Sign the exe
            $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' | Sort-Object -Descending | Select-Object -First 1
            & $signtool.FullName sign /f C:\tmp\code-signing.pfx /p 'pd-eff-signing' /tr http://timestamp.digicert.com /td sha256 /fd sha256 desktop/dist/windows/pd-eff.exe
            
            # Verify signature
            & $signtool.FullName verify /pa desktop/dist/windows/pd-eff.exe
            echo 'Signature verified successfully'
          "

      - name: Package Windows build
        run: |
          mkdir -p desktop/dist/pd-eff-windows
          cp desktop/dist/windows/pd-eff.exe desktop/dist/pd-eff-windows/
          cp -r backend/pdf_signer desktop/dist/pd-eff-windows/
          mkdir -p desktop/dist/pd-eff-windows/data/uploads
          mkdir -p desktop/dist/pd-eff-windows/data/signed
          mkdir -p desktop/dist/pd-eff-windows/data/certs

          cat > desktop/dist/pd-eff-windows/pd-eff.bat << 'BATCH'
          @echo off
          cd /d "%~dp0"
          set PORT=8765
          echo pd-eff starting on http://localhost:8765
          start "" pd-eff.exe
          timeout /t 3 /nobreak >nul
          start http://localhost:8765
          BATCH

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: pd-eff-windows
          path: desktop/dist/pd-eff-windows/

  # ─── Electron AppImage (Linux) ───────────────────────────────────────
  electron-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build frontend
        run: |
          cd frontend
          npm install --legacy-peer-deps
          npm run build

      - name: Install Electron deps
        run: |
          cd desktop
          npm install
          npx electron-builder install-app-deps

      - name: Generate icons
        run: |
          cd desktop
          mkdir -p icons
          python3 -c "
          import struct, zlib
          def create_png(w, h, r, g, b):
              def chunk(ct, data):
                  c = ct + data
                  crc = struct.pack('>I', zlib.crc32(c) & 0xffffffff)
                  return struct.pack('>I', len(data)) + c + crc
              header = b'\x89PNG\r\n\x1a\n'
              ihdr = chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0))
              raw = b''
              for y in range(h):
                  raw += b'\x00'
                  for x in range(w):
                      raw += bytes([r, g, b])
              idat = chunk(b'IDAT', zlib.compress(raw))
              iend = chunk(b'IEND', b'')
              return header + ihdr + idat + iend
          for s in [16, 32, 48, 64, 128, 256, 512]:
              png = create_png(s, s, 0x0f, 0x34, 0x60)
              with open(f'icons/{s}x{s}.png', 'wb') as f:
                  f.write(png)
          png = create_png(512, 512, 0x0f, 0x34, 0x60)
          with open('icon.png', 'wb') as f:
              f.write(png)
          print('Icons generated')
          "

      - name: Build AppImage
        run: |
          cd desktop
          npx electron-builder --linux AppImage --x64 --publish never

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: pd-eff-linux-appimage
          path: desktop/dist/electron/*.AppImage

  # ─── Electron NSIS + Portable (Windows) ──────────────────────────────
  electron-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build frontend
        run: |
          cd frontend
          npm install --legacy-peer-deps
          npm run build

      - name: Install Electron deps
        run: |
          cd desktop
          npm install
          npx electron-builder install-app-deps

      - name: Generate icons
        run: |
          cd desktop
          mkdir -p icons
          python3 -c "
          import struct, zlib
          def create_png(w, h, r, g, b):
              def chunk(ct, data):
                  c = ct + data
                  crc = struct.pack('>I', zlib.crc32(c) & 0xffffffff)
                  return struct.pack('>I', len(data)) + c + crc
              header = b'\x89PNG\r\n\x1a\n'
              ihdr = chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0))
              raw = b''
              for y in range(h):
                  raw += b'\x00'
                  for x in range(w):
                      raw += bytes([r, g, b])
              idat = chunk(b'IDAT', zlib.compress(raw))
              iend = chunk(b'IEND', b'')
              return header + ihdr + idat + iend
          for s in [16, 32, 48, 64, 128, 256, 512]:
              png = create_png(s, s, 0x0f, 0x34, 0x60)
              with open(f'icons/{s}x{s}.png', 'wb') as f:
                  f.write(png)
          png = create_png(512, 512, 0x0f, 0x34, 0x60)
          with open('icon.png', 'wb') as f:
              f.write(png)
          # Create icon.ico from embedded PNGs
          sizes = [16, 32, 48, 64, 128, 256]
          pngs = []
          for s in sizes:
              pngs.append(create_png(s, s, 0x0f, 0x34, 0x60))
          ico_header = struct.pack('<HHH', 0, 1, len(sizes))
          entries = b''
          data_offset = 6 + len(sizes) * 16
          for i, (s, p) in enumerate(zip(sizes, pngs)):
              w = 0 if s == 256 else s
              h = 0 if s == 256 else s
              entries += struct.pack('<BBBBHHII', w, h, 0, 0, 1, 32, len(p), data_offset)
              data_offset += len(p)
          with open('icon.ico', 'wb') as f:
              f.write(ico_header + entries + b''.join(pngs))
          print('Icons and icon.ico generated')
          "

      - name: Build NSIS installer
        run: |
          cd desktop
          npx electron-builder --win nsis portable --x64 --publish never

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: pd-eff-windows-electron
          path: desktop/dist/electron/*.exe
